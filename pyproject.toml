[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eregistry"
version = "1.1.1"
description = "Offline labour registration, payroll and analytics for Windows"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6==6.8.3",
  "SQLAlchemy==2.0.43",
  "sqlcipher3-wheels==0.5.6",
  "cryptography==46.0.0",
  "openpyxl==3.1.5",
  "reportlab==4.4.9",
  "Pillow==12.3.0",
  "matplotlib==3.10.8",
  "pandas==2.2.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.2.1", "ruff==0.13.1", "pyinstaller==6.16.0"]

[project.scripts]
eregistry = "eregistry.main:main"

[tool.setuptools.packages.find]
include = ["eregistry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
