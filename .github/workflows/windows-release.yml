name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest
      - name: Build portable application
        run: python -m PyInstaller packaging/eRegistry.spec --noconfirm --clean
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/eRegistry/* -DestinationPath dist/eRegistry-Portable-${{ github.ref_name }}.zip
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc packaging/eRegistry.iss
      - uses: actions/upload-artifact@v4
        with:
          name: eRegistry-Windows-${{ github.ref_name }}
          path: |
            dist/eRegistry-Portable-*.zip
            dist/installer/*.exe
          if-no-files-found: error
